[project]
name = "fraudsight"
version = "0.1.0"
description = "Real-time fraud triage: gradient-boosted scorer in the hot path, LLM agent in the investigation layer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Core deps only. Everything that needs a network service, a GPU, or a vendor
# account lives in an extra, so `uv sync` on a clean laptop always succeeds and
# `make demo` runs with zero external dependencies.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "tenacity>=9.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
    "openai>=1.55",
]
agent = [
    "langgraph>=0.2.50",
    "langgraph-checkpoint>=2.0",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]
db = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.2",
]
console = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
obs = [
    "langfuse>=2.53",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
]
pii = [
    # Optional second-stage redactor for free-text fields. The default redactor
    # is dependency-free and deterministic -- see docs/adr/0006.
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "matplotlib>=3.9",
]
all = [
    "fraudsight[llm,agent,serve,db,console,obs,dev]",
]

[project.scripts]
fraudsight = "fraudsight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudsight"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC"]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # asserts are fine in tests
    "N803",   # X_train / y_train are the sklearn convention
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# Third-party libs without stubs.
[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*", "langgraph.*", "langfuse.*", "pgvector.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires postgres/redis/a live LLM provider (deselect with -m 'not integration')",
    "slow: takes more than ~5s",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/fraudsight"]
omit = ["*/console/*"]
